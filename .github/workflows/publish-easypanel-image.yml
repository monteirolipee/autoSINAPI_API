name: Publish EasyPanel image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-easypanel-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autosinapi-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/autosinapi-api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true
          build-args: |
            BUILD_REV=${{ github.sha }}
